<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8" />  <title>Shree Mangalam Jewellers – Quick Quotation</title>
  <link rel="icon" type="image/png" href="logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1" />  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --maroon: #7a2222; --maroon-dark: #4d1313; --gold: #d9b25f; --bg: #f7f3ee; --text: #5f5146; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Poppins", sans-serif; background: radial-gradient(circle at top, #fbe9d7, #f3ebe4 35%, #e6ded6 100%); display: flex; justify-content: center; align-items: center; padding: 20px; color: var(--text); }
    .shell { max-width: 580px; width: 100%; }
    .card { background: #ffffff; border-radius: 24px; box-shadow: 0 20px 45px rgba(0, 0, 0, 0.12); padding: 28px 24px; position: relative; overflow: hidden; }
    .brand-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
    .brand-logo { width: 68px; height: 68px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15)); }
    .brand-name { font-family: "Playfair Display", serif; font-size: 1.5rem; color: var(--maroon-dark); line-height: 1.2; }
    .brand-subtitle { font-size: 0.75rem; text-transform: uppercase; color: #8a7b6e; letter-spacing: 0.05em; }
    .divider { height: 1px; background: linear-gradient(to right, transparent, rgba(0,0,0,0.08), transparent); margin: 12px 0 18px; }
    .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h2 { margin: 0; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.18em; color: #a19388; font-weight: 600; }
    .btn-small { font-size: 0.7rem; padding: 5px 12px; border-radius: 999px; border: 1px solid #e1d6c8; cursor: pointer; background: #fdfaf7; color: #8a7b6e; transition: 0.2s; }
    label { display: block; font-size: 0.8rem; margin-bottom: 6px; color: #8a7b6e; font-weight: 500; }
    textarea, input[type="number"] { width: 100%; border-radius: 12px; border: 1.5px solid #eee5db; padding: 10px 14px; font-size: 0.9rem; font-family: "Poppins", monospace; background: #fbf9f7; outline: none; }
    
    /* Custom Modal Styles */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: #fff; padding: 24px; border-radius: 20px; width: 90%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
    .modal-title { font-family: "Playfair Display", serif; font-size: 1.2rem; color: var(--maroon-dark); margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }

    #duplicate-error { color: var(--maroon); font-size: 0.75rem; margin: 8px 0; text-align: center; display: none; font-weight: 600; background: #fff1f1; padding: 6px; border-radius: 8px; }
    .result-panel { margin-top: 10px; border-radius: 20px; padding: 20px; background: linear-gradient(135deg, #fffcf5, #f8f1e5); border: 1px solid rgba(217,178,95,0.4); display: none; }
    .result-mrp { font-family: "Playfair Display", serif; font-size: 2.2rem; color: var(--maroon-dark); font-weight: 700; }
    .actions-row { display: flex; gap: 10px; margin-top: 14px; }
    .btn-pill { flex: 1; font-size: 0.8rem; padding: 12px 0; border-radius: 999px; border: none; cursor: pointer; text-transform: uppercase; font-weight: 600; }
    .btn-primary { background: linear-gradient(135deg, var(--maroon), var(--maroon-dark)); color: #fff; }
    .btn-outline { background: #fff; border: 1.5px solid #eee5db; color: #8a7b6e; }
    
    .history { margin-top: 20px; border-radius: 20px; border: 1.5px solid #eee5db; background: #fdfbf9; padding: 16px; display: none; }
    .history-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .history-table th, .history-table td { padding: 12px 6px; text-align: right; border-bottom: 1px solid #f0e9e1; }
    .history-table th:nth-child(2), .history-table td:nth-child(2), .history-table th:nth-child(3), .history-table td:nth-child(3) { text-align: left; }
    .history-table th { color: #b5a89d; text-transform: uppercase; font-size: 0.65rem; letter-spacing: 0.05em; }
    .mrp-clickable { cursor: pointer; color: var(--maroon-dark); font-weight: 600; border-bottom: 1px dashed #d9b25f; }
    .btn-delete { background: none; border: none; cursor: pointer; color: #c9bcaf; width: 100%; display: flex; justify-content: center; }
    
    /* Toggle Switch */
    .switch { position: relative; display: inline-block; width: 32px; height: 18px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #e1d6c8; transition: 0.3s; border-radius: 18px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: 0.3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--maroon); }
    input:checked + .slider:before { transform: translateX(14px); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="brand-header">
        <img src="logo.png" alt="Logo" class="brand-logo" />
        <div class="brand-text">
          <div class="brand-name">Shree Mangalam Jewellers</div>
          <div class="brand-subtitle">Specialist in Silver 925 • Since 1994</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="title-row"><h2>Quick Quotation</h2><button class="btn-small" id="sample-btn">Sample</button></div>
      <div style="margin-bottom: 12px;"><label>Scan QR</label><textarea id="qr-text" rows="2" placeholder="Paste scanned data here..."></textarea></div>
      <div style="margin-bottom: 8px;"><label>Silver rate per gram (₹)</label><input id="silver-rate" type="number" step="0.01" value="225" /></div>
      <div id="duplicate-error">⚠ Item already in history.</div>

      <div class="result-panel" id="result-panel">
        <div style="font-size:0.65rem; text-transform:uppercase; color:#b0956b; letter-spacing:0.25em;">MRP Estimate</div>
        <div id="result-code" style="font-size:0.85rem; color:#8a7b6e; font-weight:500;"></div>
        <div class="result-mrp">₹<span id="result-mrp-val">0.00</span></div>
        <div class="result-meta" id="result-meta"></div>
      </div>

      <div class="actions-row">
        <button class="btn-pill btn-primary" id="add-btn">Add item</button>
        <button class="btn-pill btn-outline" id="reset-btn">Reset</button>
      </div>

      <div class="history" id="history-section">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px; align-items: baseline;">
          <span style="font-size:0.7rem; text-transform:uppercase; color:#b5a89d; font-weight:700;">History (Dbl-Click MRP to Edit)</span>
          <span style="font-size:0.9rem; color:var(--maroon-dark);">Total: <b>₹<span id="history-total">0.00</span></b></span>
        </div>
        <table class="history-table">
          <thead><tr><th>#</th><th>Code</th><th>Item</th><th>Net wt</th><th>MRP</th><th style="width:40px;"></th><th style="width:30px;"></th></tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="edit-modal">
    <div class="modal-content">
      <div class="modal-title" id="modal-item-title">Update Making</div>
      <label>New Making Charges (₹/gm)</label>
      <input type="number" id="modal-input" placeholder="Enter value">
      <div class="modal-actions">
        <button class="btn-pill btn-primary" onclick="confirmModalEdit()">Save</button>
        <button class="btn-pill btn-outline" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const qrText = document.getElementById("qr-text"), rateEl = document.getElementById("silver-rate"), resPanel = document.getElementById("result-panel"), resBody = document.getElementById("history-body"), histSection = document.getElementById("history-section"), totalEl = document.getElementById("history-total"), errorDiv = document.getElementById("duplicate-error");
    const editModal = document.getElementById("edit-modal"), modalInput = document.getElementById("modal-input"), modalTitle = document.getElementById("modal-item-title");
    
    const itemNames = {"SAS":"Agarbati Stand","SAL":"Amoliya","SAM":"Animal Murti","SAT":"Antiques","SBM":"Baby Braclet","SKB":"Baby Kada","SBJ":"Baby Leg Kada","SBB":"Baju Band","SBG":"Bangles","SBN":"Banta","SBL":"Bell","SBX":"Box","SBK":"Bucket","SCS":"Chain Pandant Set","SCH":"Chains","SCA":"Challa","SCT":"Chatar","SCG":"Chirag","SCL":"Chotla","SCB":"Coins & Bars","SCR":"Couple Rings","SCC":"Couple Set","SCU":"Cup","SDY":"Diya","SER":"Earings","SFC":"Face/Mukota","SCP":"Fancy Pandant","SFW":"Ferwa","SFL":"Flower","SFP":"Foolpatra","SGN":"Ganpati","SGB":"Gents Bracelet","SGR":"Gents Ring","SGH":"Ghar","SGL":"Glass","SGP":"God Pandant","SBT":"Gugra","SGD":"Gulabdani","SHP":"Hath Pan","SID":"Itardani","SJO":"Jodva","SJL":"Jula","SKA":"Kada","SKK":"Kamar Kandora","SKP":"Kapoor Aarti","SKR":"Karanda","SKY":"Key Chain","SKI":"Kohiri/Keri","SLB":"Ladies Bracelet","SLR":"Ladies Ring","SLT":"Lanturn","SLK":"Leg Kada","SLO":"Lota","SLW":"Loti+Wati","SMP":"Mangalsutra Pandant","SMS":"Mangalsutra Set","SMN":"Mani","SPJ":"Mix Pooja","SMT":"Moti Ring","SMK":"Mukut","SMR":"Murti","SNY":"Naryal","SNK":"Necklace","SPH":"Path","SPI":"Patra & Yantra","SPL":"Payal","SPK":"Pichkari","SSP":"Pin/Brouch","SPB":"Plain Bands","SPR":"Purse","SRD":"Rudhraksh & More","SSH":"Shihasan","SNS":"Shivling+Nag","SSY":"Shree Yantra","SSM":"Solid Murti","SSF":"Spoon/Fali","STB":"Tabiz","STT":"Tattalu","STE":"Test","STL":"Thali","STG":"Toe Rings","STI":"Trishul","STU":"Tulsi","STR":"Turtle Ring","SVG":"Vegetable","SWC":"Waist Chain","SWL":"Watch Charms","SWS":"Watches","SWT":"Wati"};
    
    let items = [], current = null, activeEditIndex = null;

    window.onload = () => { const r = localStorage.getItem("silverRate"); if(r) rateEl.value = r; qrText.focus(); };

    qrText.addEventListener("input", function() {
      errorDiv.style.display = "none";
      const lines = this.value.split('\n').filter(l => l.trim());
      if (lines.length > 1) { 
        if (current && !items.find(it => it.code === current.code)) items.push({...current}); 
        this.value = lines[lines.length - 1]; renderHistory(); 
      }
      current = parseLine(this.value.trim()); updatePanel();
    });

    function parseLine(raw) {
      const p = raw.split(","); if (p.length < 6) return null;
      const rate = parseFloat(rateEl.value) || 0, code = p[0].trim(), wt = parseFloat(p[3]), making = parseFloat(p[5]);
      if (isNaN(wt) || isNaN(making)) return null;
      return calculateItem(code, wt, rate, making);
    }

    function calculateItem(code, wt, rate, making) {
      const mrp = wt * (rate + making) * 1.03;
      return { code, name: itemNames[code.slice(0,3).toUpperCase()] || "Silver Item", wt, rate, making, mrp, isHigh: making > 100, show: making <= 100 };
    }

    function updatePanel() {
      if (!current) { resPanel.style.display = "none"; return; }
      resPanel.style.display = "block";
      document.getElementById("result-code").textContent = `${current.code} • ${current.name}`;
      document.getElementById("result-mrp-val").textContent = current.mrp.toFixed(2);
      const meta = document.getElementById("result-meta");
      const details = current.show ? `Net wt: ${current.wt.toFixed(3)}g | Rate: ${current.rate}` : "";
      meta.innerHTML = `<span style="font-weight:500;">${details}</span>` + (current.isHigh ? `<label class="switch"><input type="checkbox" ${current.show?'checked':''} onchange="toggleCurrent(this.checked)"><span class="slider"></span></label>` : "");
    }

    function renderHistory() {
      if (!items.length) { histSection.style.display="none"; return; }
      histSection.style.display="block";
      resBody.innerHTML = items.map((it, i) => `<tr>
        <td>${i+1}</td><td style="font-weight:600;">${it.code}</td><td>${it.name}</td>
        <td>${it.show ? it.wt.toFixed(3) : '—'}</td>
        <td class="mrp-clickable" ondblclick="openEditModal(${i})">₹${it.mrp.toFixed(2)}</td>
        <td>${it.isHigh ? `<label class="switch"><input type="checkbox" ${it.show?'checked':''} onchange="toggleHist(${i})"><span class="slider"></span></label>` : ''}</td>
        <td><button class="btn-delete" onclick="deleteItem(${i})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg></button></td>
      </tr>`).join("");
      totalEl.textContent = items.reduce((s, it) => s + it.mrp, 0).toFixed(2);
    }

    // Modal Logic
    window.openEditModal = (index) => {
      activeEditIndex = index;
      const it = items[index];
      modalTitle.textContent = `Edit Making: ${it.code}`;
      modalInput.value = it.making;
      editModal.style.display = "flex";
      setTimeout(() => modalInput.focus(), 100);
    };

    window.closeModal = () => { editModal.style.display = "none"; activeEditIndex = null; };

    window.confirmModalEdit = () => {
      const newVal = parseFloat(modalInput.value);
      if (activeEditIndex !== null && !isNaN(newVal)) {
        const it = items[activeEditIndex];
        items[activeEditIndex] = calculateItem(it.code, it.wt, it.rate, newVal);
        renderHistory();
        closeModal();
      }
    };

    window.toggleCurrent = (v) => { if(current){ current.show = v; updatePanel(); }};
    window.toggleHist = (i) => { items[i].show = !items[i].show; renderHistory(); };
    window.deleteItem = (i) => { items.splice(i, 1); renderHistory(); };
    
    document.getElementById("add-btn").onclick = () => { 
      if(current){
        if (items.some(it => it.code === current.code)) { errorDiv.style.display = "block"; return; }
        items.push({...current}); current=null; qrText.value=""; resPanel.style.display="none"; errorDiv.style.display = "none";
        renderHistory(); qrText.focus();
      }
    };
    
    document.getElementById("reset-btn").onclick = () => { 
      items=[]; current=null; qrText.value=""; resPanel.style.display="none"; errorDiv.style.display = "none"; 
      renderHistory(); qrText.focus(); 
    };
    
    rateEl.oninput = () => { localStorage.setItem("silverRate", rateEl.value); if(qrText.value){ current = parseLine(qrText.value.trim()); updatePanel(); }};
    document.getElementById("sample-btn").onclick = () => { qrText.value = "STE1,925,1,0.9,1,200,\\Gm,,,,,,,,,,,,,,"; qrText.dispatchEvent(new Event('input')); qrText.focus(); };

    // Close modal on Enter key
    modalInput.addEventListener("keydown", (e) => { if(e.key === "Enter") confirmModalEdit(); });
  </script>
</body></html>
